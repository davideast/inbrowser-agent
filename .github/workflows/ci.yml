name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.detect.outputs.node }}
      driver: ${{ steps.detect.outputs.driver }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect @inbrowser/node and @inbrowser/driver E2E changes
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$BASE_SHA" ] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            CHANGED="$(git diff --name-only "${BASE_SHA}...HEAD")"
          elif [ "$EVENT_NAME" = "push" ] && [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            CHANGED="$(git diff --name-only "${BEFORE_SHA}" HEAD)"
          else
            echo "node=true" >> "$GITHUB_OUTPUT"
            echo "driver=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if printf '%s\n' "$CHANGED" | grep -Eq '^(packages/node/|package\.json$|bun\.lock$|tsconfig\.base\.json$|\.github/workflows/ci\.yml$)'; then
            echo "node=true" >> "$GITHUB_OUTPUT"
          else
            echo "node=false" >> "$GITHUB_OUTPUT"
          fi

          if printf '%s\n' "$CHANGED" | grep -Eq '^(packages/driver/|packages/node/|package\.json$|bun\.lock$|tsconfig\.base\.json$|\.github/workflows/ci\.yml$)'; then
            echo "driver=true" >> "$GITHUB_OUTPUT"
          else
            echo "driver=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - run: bun run typecheck
      - run: bun run test
      - run: bun run smoke

  node-e2e:
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build:node
      - name: Install Playwright Chromium
        working-directory: packages/node
        run: npx --no-install playwright install --with-deps chromium
      - run: bun run test:e2e:node

  driver-e2e:
    needs: changes
    if: needs.changes.outputs.driver == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build:node
      - run: bun run build:driver
      - name: Install Playwright Chromium
        working-directory: packages/driver
        run: npx --no-install playwright install --with-deps chromium
      - run: bun run test:e2e:driver

